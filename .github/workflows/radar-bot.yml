name: Cloudflare Radar Twitter Bot

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  check-outages:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests tweepy python-dotenv
        
    - name: Download posted outages history
      uses: actions/download-artifact@v4
      with:
        name: posted-outages
        path: .
      continue-on-error: true
      
    - name: Run radar bot
      env:
        API_KEY: ${{ secrets.API_KEY }}
        API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
        BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        RADAR_TOKEN: ${{ secrets.RADAR_TOKEN }}
      run: python radar_bot.py
      
    - name: Upload posted outages history
      uses: actions/upload-artifact@v4
      with:
        name: posted-outages
        path: posted_outages.json
        retention-days: 90